name: Deploy to GitHub Pages

# Publishes https://hussein-zreik.github.io/pacuhub/ whenever `main` changes.
#
# One-time setup (no computer needed): GitHub → pacuhub → Settings → Pages →
# Build and deployment → Source: "GitHub Actions".
#
# Firebase Hosting (pacuhub.web.app) is set up separately in deploy.yml and
# switches on by itself once its key exists. Both can run side by side; see
# docs/DEPLOYMENT.md for retiring this one later.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for the /pacuhub/ sub-path
        run: npm run build
        env:
          VITE_BASE_PATH: /pacuhub/
      # GitHub Pages has no rewrite rules: serving the app as the 404 page lets
      # deep links (e.g. /pacuhub/staff-access) open the right screen.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
